name: Skill Spec Validation

on:
  pull_request:
    paths:
      - "skills/**"
      - "skills-tw/**"
      - "pyproject.toml"
      - ".github/workflows/skill-validation.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "skills-tw/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills against the Agent Skills spec
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --python 3.13 --group dev

      # The reference validator from https://agentskills.io/specification. It checks the
      # closed set of allowed frontmatter fields, name rules (incl. directory match),
      # description/compatibility length limits, and parses frontmatter with strictyaml.
      # NOTE: this repo keeps the bilingual summary in `metadata.description_zh`
      # (a string), never as a top-level field -- a seventh top-level key fails here.
      - name: skills-ref validate
        run: |
          set -uo pipefail
          fail=0
          for d in skills/*/ skills-tw/*/; do
            if ! out=$(uv run skills-ref validate "$d" 2>&1); then
              fail=1
              echo "::error file=${d}SKILL.md::$(echo "$out" | tail -n +2 | tr '\n' ' ')"
              echo "FAIL $d"
              echo "$out" | sed 's/^/    /'
            fi
          done
          echo "Validated $(ls -d skills/*/ skills-tw/*/ | wc -l) skills."
          exit $fail

      # Repo rules skills-ref does not check: metadata.version, metadata.description_zh
      # (this repo's bilingual requirement), allowed-tools as space-separated string,
      # and metadata scalars as strings (except nested host-manifest blocks).
      - name: Repo and bilingual rules
        run: |
          uv run --python 3.13 --with pyyaml python - <<'PY'
          import re
          import sys
          from pathlib import Path
          import yaml

          NESTED_OK = {"openclaw", "hermes"}
          FM_RE = re.compile(r"\A---\n(.*?)\n---\n", re.S)

          errors, warnings = [], []
          for base in ("skills", "skills-tw"):
              root = Path(base)
              if not root.exists():
                  continue
              for d in sorted(root.iterdir()):
                  if not d.is_dir():
                      continue
                  md = d / "SKILL.md"
                  if not md.exists():
                      errors.append(f"{d}: missing SKILL.md")
                      continue
                  text = md.read_text()
                  m_fm = FM_RE.match(text)
                  if not m_fm:
                      errors.append(f"{md}: frontmatter must open/close with `---`")
                      continue
                  fm = yaml.safe_load(m_fm.group(1))

                  at = fm.get("allowed-tools")
                  if at is not None:
                      if not isinstance(at, str):
                          errors.append(f"{md}: allowed-tools must be a string")
                      elif "," in at:
                          errors.append(f"{md}: allowed-tools must be space-separated")

                  m = fm.get("metadata")
                  if not isinstance(m, dict):
                      errors.append(f"{md}: missing a `metadata` mapping")
                  else:
                      if "version" not in m:
                          errors.append(f"{md}: metadata.version is required")
                      if "description_zh" not in m:
                          errors.append(f"{md}: metadata.description_zh is required")
                      for k, v in m.items():
                          if k in NESTED_OK:
                              if not isinstance(v, dict):
                                  errors.append(f"{md}: metadata.{k} must stay nested")
                              continue
                          if isinstance(v, str):
                              continue
                          errors.append(f"{md}: metadata.{k} must be a string")

                  if text.count("\n") + 1 > 500:
                      warnings.append(f"{md}: over 500 lines")

          for w in warnings:
              print(f"::warning file={w.split(':')[0]}::{w}")
          for e in errors:
              print(f"::error file={e.split(':')[0]}::{e}")
              print(f"FAIL {e}")
          print(f"\n{len(errors)} error(s), {len(warnings)} warning(s).")
          sys.exit(1 if errors else 0)
          PY
